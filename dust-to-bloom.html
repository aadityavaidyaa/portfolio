<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dust to Bloom — Short Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1215; --bg-alt:#15191D; --bg-elev:#1C2126;
  --line:#2A3037; --line-soft:#22272C;
  --ink:#ECE9E2; --ink-dim:#9A9D9F; --ink-faint:#61656A;
  --brass:#C9A961; --brass-dim:#8A7346; --brass-glow:rgba(201,169,97,0.15);
  --serif:'Fraunces', Georgia, serif; --sans:'Inter', -apple-system, sans-serif; --mono:'JetBrains Mono', monospace;
  --container:900px;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{ background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.65; }
.wrap{ max-width:var(--container); margin:0 auto; padding:0 40px; }
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
::selection{ background:var(--brass); color:#141414; }

header{ padding:28px 0; border-bottom:1px solid var(--line-soft); }
.back-link{
  font-family:var(--mono); font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--ink-dim); display:inline-flex; align-items:center; gap:10px; transition:color .3s ease;
}
.back-link:hover{ color:var(--brass); }

.film-hero{ padding:64px 0 40px; }
.film-status{
  font-family:var(--mono); font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--brass); border:1px solid var(--brass-dim); display:inline-block; padding:6px 14px;
  border-radius:2px; margin-bottom:22px;
}
.film-status.status-upcoming{ border-color:#B23A3A; color:#E2574C; }
.film-hero h1{
  font-family:var(--serif); font-weight:400; font-size:clamp(38px,6.5vw,68px); line-height:1.02; letter-spacing:-0.01em;
}
.film-meta{
  display:flex; gap:36px; flex-wrap:wrap; margin-top:30px; padding-top:26px; border-top:1px solid var(--line-soft);
}
.meta-item .meta-label{
  font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px;
}
.meta-item .meta-value{ font-size:15px; color:var(--ink); }

.poster{
  margin:48px 0; height:340px; border-radius:4px; overflow:hidden;
  background:linear-gradient(135deg, var(--bg-elev), var(--bg-alt)); border:1px solid var(--line-soft);
  display:flex; align-items:center; justify-content:center;
}
.poster .ph{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); text-align:center; padding:24px; }
.poster img{ width:100%; height:100%; object-fit:cover; }

section{ padding:44px 0; border-top:1px solid var(--line-soft); }
.eyebrow{
  font-family:var(--mono); font-size:11.5px; color:var(--brass); letter-spacing:0.12em;
  text-transform:uppercase; margin-bottom:16px; display:block;
}
h2{ font-family:var(--serif); font-weight:400; font-size:clamp(24px,3.4vw,34px); margin-bottom:18px; }
p{ color:var(--ink-dim); font-size:16px; max-width:640px; }
p + p{ margin-top:14px; }

.credits-list{ display:grid; grid-template-columns:1fr 1fr; gap:18px 40px; margin-top:8px; }
.credit{ border-top:1px solid var(--line-soft); padding-top:14px; }
.credit-role{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; }
.credit-value{ font-size:15px; color:var(--ink); }

.gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:24px; }
.gallery .still{
  aspect-ratio:4/3; border-radius:4px; background:linear-gradient(135deg, var(--bg-elev), var(--bg-alt));
  border:1px solid var(--line-soft); display:flex; align-items:center; justify-content:center;
}
.gallery .still span{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); }

footer{ padding:40px 0 60px; }
.footer-back{
  font-family:var(--mono); font-size:12.5px; letter-spacing:0.05em; text-transform:uppercase;
  border:1px solid var(--brass-dim); color:var(--brass); padding:13px 26px; display:inline-block;
  transition:background .3s ease, color .3s ease;
}
.footer-back:hover{ background:var(--brass); color:#12151A; }

@media (max-width:640px){
  .wrap{ padding:0 24px; }
  .credits-list{ grid-template-columns:1fr; }
  .gallery{ grid-template-columns:1fr 1fr; }
  .poster{ height:260px; }
}
</style>
</head>
<body>

<header class="wrap">
  <a href="index.html#films" class="back-link">&#8592; Back to portfolio</a>
</header>

<main class="wrap">
  <section class="film-hero" style="border-top:none; padding-top:0;">
    <span class="film-status" id="filmStatus"></span>
    <h1 id="filmTitle"></h1>
    <div class="film-meta">
      <div class="meta-item">
        <div class="meta-label">Date</div>
        <div class="meta-value" id="filmDate"></div>
      </div>
      <div class="meta-item">
        <div class="meta-label">Role</div>
        <div class="meta-value" id="filmRole"></div>
      </div>
      <div class="meta-item">
        <div class="meta-label">Format</div>
        <div class="meta-value" id="filmFormat"></div>
      </div>
    </div>
    <div class="poster" id="filmPoster">
      <div class="ph">poster / key art goes here</div>
    </div>
  </section>

  <section>
    <span class="eyebrow">Synopsis</span>
    <h2>What it's about</h2>
    <div id="filmSynopsis"></div>
  </section>

  <section>
    <span class="eyebrow">Stills</span>
    <h2>Frames from the film</h2>
    <div class="gallery" id="filmGallery"></div>
  </section>

  <section>
    <span class="eyebrow">Credits</span>
    <h2>Who worked on it</h2>
    <div class="credits-list" id="filmCredits"></div>
  </section>

  <footer>
    <a href="index.html#films" class="footer-back">&#8592; Back to Short Films</a>
  </footer>
</main>

<script>
/* FILM_DATA_START */
const filmData = {
  "title": "Dust to Bloom",
  "status": "Released",
  "date": "21 Oct 2023 / 23 Aug 2024",
  "role": "Director",
  "format": "3D Short Film",
  "poster": "images/Dust.jpeg",
  "synopsis": [
    "A single drop of water falls on a dry and empty land. Slowly, it brings life back to the land, turning it into a green and beautiful place filled with nature. The story shows that even the smallest things can make a big difference.\n"
  ],
  "stills": [
    "images/1786444165089_DTB.png",
    "images/1786444174126_DTB3.png",
    "images/1786444176476_DTB.png"
  ],
  "credits": [
    {
      "role": "Direction",
      "value": "Aaditya Vaidya"
    },
    {
      "role": "Animation",
      "value": "Aaditya Vaidya"
    },
    {
      "role": "Sound",
      "value": "Aaditya Vaidya"
    },
    {
      "role": "Runtime",
      "value": "Aaditya Vaidya"
    }
  ]
};
/* FILM_DATA_END */

document.title = filmData.title + " — Short Film";
document.getElementById('filmTitle').textContent = filmData.title;
document.getElementById('filmDate').textContent = filmData.date;
document.getElementById('filmRole').textContent = filmData.role;
document.getElementById('filmFormat').textContent = filmData.format;

const statusEl = document.getElementById('filmStatus');
statusEl.textContent = filmData.status;
if (filmData.status !== 'Released') statusEl.classList.add('status-upcoming');

const posterEl = document.getElementById('filmPoster');
posterEl.innerHTML = filmData.poster
  ? `<img src="${filmData.poster}" alt="${filmData.title}">`
  : `<div class="ph">poster / key art goes here</div>`;

const synopsisEl = document.getElementById('filmSynopsis');
filmData.synopsis.forEach(t => {
  const p = document.createElement('p');
  p.textContent = t;
  synopsisEl.appendChild(p);
});

const galleryEl = document.getElementById('filmGallery');
filmData.stills.forEach((src, i) => {
  const div = document.createElement('div');
  div.className = 'still';
  div.innerHTML = src
    ? `<img src="${src}" alt="Still ${i + 1}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;">`
    : `<span>still ${String(i + 1).padStart(2, '0')}</span>`;
  galleryEl.appendChild(div);
});

const creditsEl = document.getElementById('filmCredits');
filmData.credits.forEach(c => {
  const div = document.createElement('div');
  div.className = 'credit';
  div.innerHTML = `<div class="credit-role"></div><div class="credit-value"></div>`;
  div.querySelector('.credit-role').textContent = c.role;
  div.querySelector('.credit-value').textContent = c.value;
  creditsEl.appendChild(div);
});
</script>


</body>
</html>
